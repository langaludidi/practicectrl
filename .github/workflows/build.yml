name: PracticeCtrl Build Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rdgkyallteuyceagoddh.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wIlpKciGYF3PTyCsOIED3Q_-62Jy5Eo
      VERCEL: "1"
      VERCEL_ENV: production
      VERCEL_TARGET_ENV: production
      VERCEL_URL: practicectrl-ci.vercel.app
      VERCEL_PROJECT_PRODUCTION_URL: practicectrl-ludidil-5352s-projects.vercel.app
      VERCEL_FORCE_NO_BUILD_CACHE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm run typecheck

      - name: Clinical regression tests
        run: npm run test:clinical

      - name: Production build under Vercel environment
        run: npm run build
