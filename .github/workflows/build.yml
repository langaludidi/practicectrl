name: PracticeCtrl Build Verification

on:
  push:
    branches:
      - main
      - feature/practice-configuration-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI verifies compilation, never connects to a tenant database.
      NEXT_PUBLIC_SUPABASE_URL: https://hyajnfdzarbygkvvfbnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VERCEL: "1"
      VERCEL_ENV: preview
      VERCEL_TARGET_ENV: preview
      VERCEL_URL: practicectrl-ci.vercel.app
      VERCEL_PROJECT_PRODUCTION_URL: practicectrl-ludidil-5352s-projects.vercel.app
      VERCEL_FORCE_NO_BUILD_CACHE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency vulnerability check
        run: npm audit --audit-level=moderate

      - name: TypeScript verification
        run: npm run typecheck

      - name: Clinical regression tests
        run: npm run test:clinical

      - name: Authentication redirect and internal link checks
        run: npm run test:security && npm run audit:links

      - name: Preview build with inert authentication key
        run: npm run build
